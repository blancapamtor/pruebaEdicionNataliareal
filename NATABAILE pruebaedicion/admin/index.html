<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Control | Natalia Vicente</title>
  
  <!-- Carga de la fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Estilos personalizados para Decap CMS -->
  <link rel="stylesheet" href="cms-custom.css" />
  
  <!-- Widget Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Carga de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    window.addEventListener('change', function(e) {
      if (e.target && e.target.type === 'file') {
        const file = e.target.files[0];
        const maxMb = 25; // Define el límite en Megabytes que desees
        const maxBytes = maxMb * 1024 * 1024;
        
        if (file && file.size > maxBytes) {
          alert(`⚠️ El archivo "${file.name}" supera el límite permitido de ${maxMb}MB. Por favor, comprímelo antes de subirlo.`);
          e.target.value = ''; // Cancela la selección del archivo
        }
      }
    }, true);
  </script>

  <!-- 🎨 PLANTILLAS DE VISTA PREVIA EN TIEMPO REAL -->
  <script>
    // 1. Inyectamos los estilos reales de la web y los personalizados al iframe
    CMS.registerPreviewStyle('../assets/css/main.css');
    CMS.registerPreviewStyle('cms-custom.css');

    // ==========================================
    // 2. COMPONENTE PREVIEW: TARJETA DE CLASE (SOPORTE MULTI-HORARIO)
    // ==========================================
    const ClassPreview = createClass({
      render: function() {
        const entry = this.props.entry;

        const badge = entry.getIn(['data', 'badge']) || 'CATEGORÍA / ETIQUETA';
        const title = entry.getIn(['data', 'title']) || 'TÍTULO DE LA CLASE';
        
        const schedulesData = entry.getIn(['data', 'schedules']);
        let schedules = schedulesData ? schedulesData.toJS() : [];

        if (schedules.length === 0) {
          schedules = [{
            sub_title: '',
            city: 'LUGAR (Ej: MADRID CENTRO)',
            time_slots: [
              { day: 'Lunes', time_slot: '19:00h', meta_extra: 'Avanzado' },
              { day: 'Miércoles', time_slot: '20:30h', meta_extra: 'Iniciación' }
            ],
            address: 'C/ Paz 4 (Casa Castilla-La Mancha)',
            description: 'Escribe aquí la información desplegable...',
            map_link: '#'
          }];
        }

        return h('div', { style: { padding: '30px 15px', background: '#f8fafc', minHeight: '100vh' } },
          h('article', { className: 'class-card', style: { margin: '0 auto', maxWidth: '420px' } },
            h('div', { className: 'card-top' },
              h('span', { className: 'level-badge' }, badge),
              h('h3', { className: 'card-title' }, title),
              
              h('div', { className: 'schedule-block' },
                schedules.map((s, index) => {
                  let slots = s.time_slots && Array.isArray(s.time_slots) ? s.time_slots : [];
                  if (slots.length === 0 && (s.day || s.time_slot)) {
                    slots = [{ day: s.day, time_slot: s.time_slot, meta_extra: s.meta_extra }];
                  }

                  return h('div', { key: index, style: { marginBottom: '20px' } },
                    s.sub_title ? h('h4', { className: 'card-title', style: { fontSize: '1.2rem', marginTop: '15px', marginBottom: '10px' } }, s.sub_title) : null,

                    h('details', { className: 'schedule-item', open: true },
                      h('summary', {},
                        h('div', { className: 'summary-header' },
                          s.city ? h('span', { className: 'city-tag' }, s.city) : null,
                          
                          slots.map((ts, tsIdx) => 
                            h('div', { key: tsIdx, className: 'schedule-meta', style: { marginBottom: '4px' } },
                              h('strong', {}, ts.day || 'Día'),
                              ts.time_slot ? h('span', {}, ` · ${ts.time_slot}`) : null,
                              ts.meta_extra ? h('em', {}, ` (${ts.meta_extra})`) : null
                            )
                          ),
                          
                          s.address ? h('small', { className: 'schedule-address' },
                            h('svg', { 
                              viewBox: '0 0 24 24', 
                              fill: 'none', 
                              stroke: 'currentColor', 
                              strokeWidth: '2', 
                              width: '12', 
                              height: '12', 
                              style: { marginRight: '4px', verticalAlign: 'middle' } 
                            }, 
                              h('path', { d: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z' }),
                              h('circle', { cx: '12', cy: '10', r: '3' })
                            ),
                            s.address
                          ) : null
                        ),
                        h('div', { className: 'toggle-icon' })
                      ),
                      
                      h('div', { className: 'item-extra-info' },
                        s.description ? h('p', {}, s.description) : null,
                        s.map_link ? h('a', { 
                          href: s.map_link, 
                          target: '_blank', 
                          className: 'location-link' 
                        }, '📍 Ver ubicación en mapa') : null
                      )
                    )
                  );
                })
              )
            ),
            
            h('div', { className: 'card-bottom' },
              h('a', { href: '#', className: 'btn' }, '¡APÚNTATE!')
            )
          )
        );
      }
    });

    // ==========================================================
    // 3. PREVISUALIZACIÓN DE NOTICIA DESTACADA (AZUL)
    // ==========================================================
    const FeaturedNewsPreview = createClass({
      getInitialState: function() {
        return { open: false };
      },
      toggleOpen: function() {
        this.setState({ open: !this.state.open });
      },
      render: function() {
        const entry = this.props.entry;
        const tag = entry.getIn(['data', 'tag']) || 'NOTICIA';
        const frequency = entry.getIn(['data', 'frequency']) || '';
        const title = entry.getIn(['data', 'title']) || 'Escribe aquí el título...';
        const subtitle = entry.getIn(['data', 'subtitle']) || '';
        const location = entry.getIn(['data', 'location']) || '';
        const image = entry.getIn(['data', 'image']);
        const organizer = entry.getIn(['data', 'organizer']) || '';
        const extraInfo = entry.getIn(['data', 'extra_info']) || '';
        const body = entry.getIn(['data', 'body']) || (this.props.widgetFor ? this.props.widgetFor('body') : '');
        const isOpen = this.state.open;

        const bgImageStyle = image 
          ? { backgroundImage: `url(${this.props.getAsset(image)})` } 
          : { backgroundColor: '#111827' };

        return h('div', { className: 'news-section', style: { padding: '30px 15px', background: '#fcfbf7', minHeight: '100vh' } },
          h('div', { style: { maxWidth: '580px', margin: '0 auto' } },
            h('article', { className: 'card-featured' },
              h('div', { className: 'card-media' },
                h('div', { className: 'media-img', style: bgImageStyle }),
                h('span', { className: 'badge badge-accent' }, tag)
              ),
              h('div', { className: 'card-content' },
                h('div', {},
                  frequency ? h('div', { className: 'card-meta' }, frequency) : null,
                  h('h3', { className: 'card-title' }, title),
                  subtitle ? h('p', { className: 'card-subtitle-highlight', style: { fontSize: '1rem', color: '#1f2937', fontWeight: '700', margin: '4px 0 12px 0' } }, subtitle) : null,
                  h('ul', { className: 'card-details' },
                    organizer ? h('li', {},
                      h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2' },
                        h('path', { d: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2' }),
                        h('circle', { cx: '12', cy: '7', r: '4' })
                      ),
                      h('strong', {}, `Org: ${organizer}`)
                    ) : null,
                    location ? h('li', { style: { color: '#00b4d8', fontWeight: 'bold' } },
                      h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2' },
                        h('path', { d: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z' }),
                        h('circle', { cx: '12', cy: '10', r: '3' })
                      ),
                      h('span', {}, location)
                    ) : null,
                    extraInfo ? h('li', { style: { marginTop: '8px', opacity: 0.9 } },
                      h('span', {}, extraInfo)
                    ) : null
                  )
                ),
                h('div', { className: 'card-actions', style: { marginTop: '15px' } },
                  h('button', { 
                    type: 'button', 
                    className: 'btn-dark', 
                    onClick: this.toggleOpen,
                    style: { width: '100%', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', border: 'none' } 
                  }, 
                    isOpen ? 'MENOS INFORMACIÓN ▲' : 'MÁS INFORMACIÓN ▼'
                  )
                ),
                isOpen ? h('div', { className: 'expanded-content-featured', style: { marginTop: '15px', paddingTop: '15px', borderTop: '1px dashed rgba(255,255,255,0.3)', textAlign: 'left' } },
                  body
                ) : null
              )
            )
          )
        );
      }
    });
    
    // ==========================================
    // 4. PREVISUALIZACIÓN DE NOTICIA SECUNDARIA
    // ==========================================
    const SecondaryNewsPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        
        const tag = entry.getIn(['data', 'tag']) || 'CLASE GRATUITA';
        const statusTag = entry.getIn(['data', 'status_tag']) || '';
        const title = entry.getIn(['data', 'title']) || 'INICIACIÓN AL BAILE';
        const subtitle = entry.getIn(['data', 'subtitle']) || '';
        const dateStr = entry.getIn(['data', 'date_str']) || ''; 
        const location = entry.getIn(['data', 'location']) || '';
        const extraInfo = entry.getIn(['data', 'extra_info']) || '';
        
        // Evitamos la excepción leyendo la propiedad como string si widgetFor da error
        let body = entry.getIn(['data', 'body']) || '';
        try {
          if (this.props.widgetFor && this.props.widgetFor('body')) {
            body = this.props.widgetFor('body');
          }
        } catch (e) {
          body = entry.getIn(['data', 'body']) || '';
        }

        return h('div', { className: 'news-section', style: { padding: '30px 15px', background: '#fdfbf7', minHeight: '100vh' } },
          h('div', { style: { maxWidth: '440px', margin: '0 auto' } },
            h('article', { className: 'news-sidebar' },
              h('div', { className: 'card-secondary is-expanded' },
                
                h('div', { className: 'card-badge-row' },
                  h('span', { className: 'badge badge-subtle' }, tag),
                  h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
                    statusTag ? h('span', { className: 'status-indicator' }, statusTag) : null,
                    h('button', { className: 'card-close-btn', style: { display: 'flex' } },
                      h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5' },
                        h('line', { x1: '18', y1: '6', x2: '6', y2: '18' }),
                        h('line', { x1: '6', y1: '6', x2: '18', y2: '18' })
                      )
                    )
                  )
                ),

                h('h3', { className: 'card-title' }, title),
                subtitle ? h('p', { style: { fontSize: '0.95rem', color: '#1f2937', fontWeight: '600', margin: '0 0 12px 0' } }, subtitle) : null,

                location ? h('div', { className: 'card-location' },
                  h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2' },
                    h('path', { d: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z' }),
                    h('circle', { cx: '12', cy: '10', r: '3' })
                  ),
                  h('div', {},
                    h('strong', {}, location),
                    dateStr ? h('p', {}, dateStr) : null
                  )
                ) : null,

                extraInfo ? h('p', { style: { fontSize: '0.85rem', color: '#5a6e82', margin: '0 0 16px 0' } }, extraInfo) : null,

                h('button', { 
                  className: 'btn-cyan-outline', 
                  type: 'button',
                  style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', width: '100%' } 
                },
                  'VER MENOS',
                  h('svg', { 
                    viewBox: '0 0 24 24', 
                    fill: 'none', 
                    stroke: 'currentColor', 
                    strokeWidth: '2.5',
                    style: { width: '16px', height: '16px' }
                  },
                    h('path', { d: 'M6 9l6 6 6-6' })
                  )
                ),

                h('div', { className: 'expanded-content', style: { display: 'block', marginTop: '16px', paddingTop: '16px', borderTop: '1px dashed rgba(12, 25, 44, 0.08)' } },
                  h('div', { style: { fontSize: '0.9rem', lineHeight: '1.6', color: '#374151', marginBottom: '16px' } }, body),
                  h('div', { style: { marginTop: '14px', paddingTop: '10px', borderTop: '1px dashed rgba(0,0,0,0.1)' } },
                    h('a', { 
                      href: '#', 
                      style: { color: '#00a6cc', fontWeight: '700', fontSize: '0.92rem', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '6px' } 
                    },
                      '¿Te interesa? Contáctame aquí',
                      h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', style: { width: '16px', height: '16px' } },
                        h('path', { d: 'M5 12h14M12 5l7 7-7 7' })
                      )
                    )
                  )
                )

              )
            )
          )
        );
      }
    });

   // ==========================================
    // 5. PREVISUALIZACIÓN DE GALERÍA MULTIMEDIA
    // ==========================================
    const GalleryPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const itemsData = entry.getIn(['data', 'items']);
        const items = itemsData ? itemsData.toJS() : [];
        const getAsset = this.props.getAsset;

        return h('section', { className: 'multimedia-section', style: { padding: '20px', background: '#ffffff', minHeight: '100vh' } },
          h('div', { className: 'container' },
            h('h2', { className: 'section-title', style: { marginBottom: '20px', fontSize: '1.5rem', color: '#00c4f0' } }, 'VISTA PREVIA DE GALERÍA'),
            
            h('div', { className: 'gallery-grid' },
              items.map((item, index) => {
                const src = item.file_url || item.image;
                if (!src) return null;

                const mediaUrl = getAsset(src);
                const altText = item.title || 'Galería Natalia Vicente';
                const captionText = item.caption || '';
                const isVideo = src.match(/\.(mp4|webm|mov|ogg)$/i);

                return h('figure', { key: index, className: 'gallery-item', style: { margin: 0, display: 'flex', flexDirection: 'column' } },
                  isVideo 
                    ? h('video', { 
                        src: mediaUrl, 
                        controls: true, 
                        muted: true, 
                        loop: true,
                        playsInline: true,
                        style: { width: '100%', height: 'auto', display: 'block', borderRadius: '8px 8px 0 0' } 
                      })
                    : h('img', { 
                        src: mediaUrl, 
                        alt: altText,
                        style: { width: '100%', height: 'auto', display: 'block', borderRadius: '8px 8px 0 0' } 
                      }),
                  captionText 
                    ? h('figcaption', { 
                        style: { 
                          padding: '8px 12px', 
                          fontSize: '0.85rem', 
                          color: '#475569', 
                          background: '#f8fafc', 
                          borderTop: '1px solid #e2e8f0',
                          borderRadius: '0 0 8px 8px',
                          fontStyle: 'italic'
                        } 
                      }, captionText) 
                    : null
                );
              })
            )
          )
        );
      }
    });

    // ==========================================
    // 6. REGISTRO DE PLANTILLAS EN DECAP CMS
    // ==========================================
    CMS.registerPreviewTemplate('clases', ClassPreview);
    CMS.registerPreviewTemplate("noticias_destacadas", FeaturedNewsPreview);
    CMS.registerPreviewTemplate("noticias_destacadas_page", FeaturedNewsPreview);
    CMS.registerPreviewTemplate("noticias_secundarias", SecondaryNewsPreview);
    CMS.registerPreviewTemplate("noticias_secundarias_page", SecondaryNewsPreview);
    CMS.registerPreviewTemplate("galeria", GalleryPreview);
    CMS.registerPreviewTemplate("galeria_page", GalleryPreview);
  </script>
</body>
</html>
