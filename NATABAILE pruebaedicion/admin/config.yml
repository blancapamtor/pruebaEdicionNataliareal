backend:
  name: git-gateway
  repo: blancapamtor/pruebaEdicionNataliareal
  branch: main

media_folder: "NATABAILE pruebaedicion/assets/imagenes"
public_folder: "assets/imagenes"

collections:
  # 🌟 1. NOTICIAS DESTACADAS
  - name: "noticias_destacadas_page"
    label: "🌟 Noticias Destacadas"
    files:
      - file: "NATABAILE pruebaedicion/content/noticias_destacadas.json"
        label: "Gestión Noticias Destacadas"
        name: "noticias_destacadas"
        fields:
          - label: "Lista de Noticias Destacadas"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Etiqueta", name: "tag", widget: "string", default: "NOTICIA" }
              - { label: "Frecuencia / Días", name: "frequency", widget: "string", required: false }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
              - { label: "Ubicación", name: "location", widget: "string", required: false }
              - { label: "Imagen de Fondo", name: "image", widget: "image" }
              - { label: "Organizador", name: "organizer", widget: "string", required: false }
              - { label: "Información Extra", name: "extra_info", widget: "text", required: false }
              - { label: "Texto del Cuerpo", name: "body", widget: "text", required: false }

  # 📄 2. NOTICIAS SECUNDARIAS
  - name: "noticias_secundarias_page"
    label: "📄 Noticias Secundarias"
    files:
      - file: "NATABAILE pruebaedicion/content/noticias_secundarias.json"
        label: "Gestión Noticias Secundarias"
        name: "noticias_secundarias"
        fields:
          - label: "Lista de Noticias Secundarias"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Etiqueta Principal", name: "tag", widget: "string", default: "CLASE GRATUITA" }
              - { label: "Etiqueta secundaria", name: "status_tag", widget: "string", required: false }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
              - { label: "Fecha", name: "date_str", widget: "string", required: false }
              - { label: "Lugar", name: "location", widget: "string", required: false }
              - { label: "Información Extra", name: "extra_info", widget: "text", required: false }
              - { label: "Detalles desplegable", name: "body", widget: "text", required: false }

  # 🕺 3. CLASES Y TALLERES
  - name: "clases_page"
    label: "🕺 Clases y Talleres"
    files:
      - file: "NATABAILE pruebaedicion/content/clases.json"
        label: "Gestión de Clases"
        name: "clases"
        fields:
          - label: "Lista de Clases"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} • (Orden: {{fields.order}})"
            fields:
              - { label: "Etiqueta superior (Categoría / Nivel)", name: "badge", widget: "string", required: true }
              - { label: "Título Principal", name: "title", widget: "string", required: true }
              - { label: "Orden de Aparición", name: "order", widget: "number", default: 1, value_type: "int" }
              - label: "Ubicaciones"
                name: "schedules"
                widget: "list"
                fields:
                  - { label: "Subtítulo", name: "sub_title", widget: "string", required: false }
                  - { label: "LUGAR / CIUDAD", name: "city", widget: "string", required: true }
                  - label: "Horarios"
                    name: "time_slots"
                    widget: "list"
                    fields:
                      - { label: "Día", name: "day", widget: "string", required: true }
                      - { label: "Horario", name: "time_slot", widget: "string", required: true }
                      - { label: "Meta Extra", name: "meta_extra", widget: "string", required: false }
                  - { label: "Dirección", name: "address", widget: "string", required: true }
                  - { label: "Descripción", name: "description", widget: "text", required: true }
                  - { label: "Enlace Google Maps", name: "map_link", widget: "string", required: true }

# 📸 4. GALERÍA MULTIMEDIA
  - name: "galeria_pagina"
    label: "📸 Galería Multimedia"
    files:
      - file: "NATABAILE pruebaedicion/content/galeria.json"
        label: "Gestión de Galería"
        name: "galeria"
        fields:
          - label: "Elementos de la Galería"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} - {{fields.file_url}}"
            fields:
              - { label: "Título / Descripción Alt (Opcional)", name: "title", widget: "string", default: "Natalia Vicente", required: false }
              - { label: "Archivo (Imagen o Vídeo MP4/MOV)", name: "file_url", widget: "file" }